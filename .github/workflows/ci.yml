name: Задание 1 - Базовый конвейер

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Валидация
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Вывод версии Python и коммита
        run: |
          python --version
          echo "Коммит: ${{ github.sha }}"

      - name: Компиляция всех .py-файлов
        run: python -m compileall -q .

  # 2. Тесты 
  unit_tests:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Запуск unit-тестов
        run: python -m unittest discover -s tests -v

  # 3. Упаковка
  package:
    needs: unit_tests
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Формирование каталога dist и манифеста
        run: |
          mkdir -p dist
          cp task_app.py dist/
          cp README.md dist/
          cp Dockerfile dist/
          cp tasks.json.example dist/
          
          echo "CI_COMMIT_SHA: ${{ github.sha }}" > dist/manifest.txt
          echo "CI_PIPELINE_ID: ${{ github.run_id }}" >> dist/manifest.txt
          echo "Файлы:" >> dist/manifest.txt
          ls dist/ >> dist/manifest.txt
          
          echo "Содержимое manifest.txt:"
          cat dist/manifest.txt

      - name: Публикация артефакта (срок хранения 7 дней)
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7