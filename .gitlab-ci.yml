stages:
  - validate
  - test
  - package

validate:
  stage: validate
  image: python:3.12.7-slim
  script:
    - echo "Проверка версии Python:"
    - python --version
    - echo "Коммит: $CI_COMMIT_SHA"
    - echo "Компиляция всех .py-файлов"
    - python -m compileall -q .

test:
  stage: test
  image: python:3.12.7-slim
  script:
    - echo "Стадия test"

package:
  stage: package
  image: python:3.12.7-slim
  script:
    - echo "Стадия package"